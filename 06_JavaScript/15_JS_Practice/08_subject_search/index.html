<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subject Search</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Subject Search</h1>
        <p>Search for your subjects below.</p>

        <input
            type="text"
            id="search-input"
            placeholder="Search subjects..."
            aria-label="Search subjects"
        >

        <ul id="subject-list"></ul>

        <p id="no-results" hidden>No matching subjects found.</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
