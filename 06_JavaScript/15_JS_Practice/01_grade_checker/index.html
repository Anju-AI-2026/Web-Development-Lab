<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade Checker</title>
</head>
<body>

    <h1>Grade Checker</h1>

    <form id="gradeForm">

        <input
            id="nameInput"
            type="text"
            placeholder="Enter your name"
        ><br><br>

        <input
            id="marksInput"
            type="number"
            placeholder="Enter your marks"
        ><br><br>

        <button type="submit">Check Grade</button><br><br>

    </form>

    <p id="output"></p>

    <script src="script.js"></script>

</body>
</html>
