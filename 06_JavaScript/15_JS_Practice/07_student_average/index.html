<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Average Calculator</title>
</head>
<body>

    <h1>Student Average Calculator</h1>

    <form id="student-form">
        <label for="student-name">Student Name:</label>
        <input type="text" id="student-name" placeholder="Enter student name" required>

        <br><br>

        <label for="mark1">Subject 1:</label>
        <input type="number" id="mark1" placeholder="Enter marks" min="0" max="100" required>

        <br><br>

        <label for="mark2">Subject 2:</label>
        <input type="number" id="mark2" placeholder="Enter marks" min="0" max="100" required>

        <br><br>

        <label for="mark3">Subject 3:</label>
        <input type="number" id="mark3" placeholder="Enter marks" min="0" max="100" required>

        <br><br>

        <button type="submit">Calculate Average</button>
    </form>

    <h2>Student Result</h2>

    <p id="result"></p>

    <script src="script.js"></script>
</body>
</html>
