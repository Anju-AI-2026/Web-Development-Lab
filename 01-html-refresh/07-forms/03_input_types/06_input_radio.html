<html>

        <title>Input Radio</title>

    <body>
        <h1>Habbit Collection Form</h1>
        <form>
            <label>Name :</label>
            <input type="text" placeholder="Enter your name"><br><br>
            <label>

            <label>
                <input type="radio" name="Reading" value="Reading">Reading
            </label><br>
            <label>
                <input type="radio" name="Writing" value="Writing">Writing
            </label>
        </form>
    </body>
</html>
