<html>
    <head>
        <title>Fieldset and Legend</title>
    </head>
    <body>
        <h1>
            Fieldset and Legend
        </h1>
        <form>
            <fieldset>
                <legend>Student Information</legend>

                <label>Name:</label>
                <input type="text">

                <br><br>

                <label>Email:</label>
                <input type="email">
            </fieldset>
        </form>
    </body>
</html>
