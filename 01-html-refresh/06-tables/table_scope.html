<html>
    <head>
        <title>
            Table Scope
        </title>
    </head>
    <body>
        <table border="3px">
            <thead>
                <tr>
                    <th>Subject</th>
                    <th>Marks</th>
                    <th scope="col">Grade</th>
                </tr>
            </thead>    
            <tbody>
                <tr>
                    <th>Python</th>
                    <td>95</td>
                    <td>A+</td>
                </tr>
                <tr>
                    <td>DBMS</td>
                    <td>84</td>
                    <td>B+</td>
                </tr>
                <tr>
                    <td>Java</td>
                    <td>90</td>
                    <td>A</td>
                </tr>
            </tbody>
        </table><br><br><br>
        <table border="3px">
            <thead>
                <tr>
                    <th>Employee</th>
                    <th>Monday</th>
                    <th>Tuesday</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <th scope="row">Anjali</th>
                    <td>6 hrs</td>
                    <td>7 hrs</td>
                </tr> 
                <tr>
                    <th scope="row">Rahul</th>
                    <td>8 hrs</td>
                    <td>5 hrs</td>
                </tr>
            </tbody>
        </table>
    </body>
</html>
