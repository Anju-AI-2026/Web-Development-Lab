<html>
    <head>
        <title>
            Table Scope
        </title>
    </head>
    <body>
        <table border="3px">
            <thead>
                <tr>
                    <th scope="col">Subject</th>
                    <th scope="col">Marks</th>
                    <th scope="col">Grade</th>
                </tr>
            </thead>    
            <tbody>
                <tr>
                    <td>Python</td>
                    <td>95</td>
                    <td>A+</td>
                </tr>
                <tr>
                    <td>DBMS</td>
                    <td>84</td>
                    <td>B+</td>
                </tr>
                <tr>
                    <td>Java</td>
                    <td>90</td>
                    <td>A</td>
                </tr>
            </tbody>
        </table>
    </body>
</html>
