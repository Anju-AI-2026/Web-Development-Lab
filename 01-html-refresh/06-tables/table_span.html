<html>
    <head>
        <title>
            Table Span
        </title>
        <style>
            body{
                background-color: rgb(242, 212, 174);
            }
            h1{
                text-align: center;
                color: rgb(82, 82, 190);
            }
        </style>
    </head>
    <body>
        <h1>
            WEEKLY TIMETABLE
        </h1>
        <table border="3px">
            <caption>A student Weekly Timetable</caption>
            <thead>
                <tr>
                    <th>Day</th>
                    <th>Subject</th>
                    <th>Time</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Monday</td>
                    <td>Python</td>
                    <td>9:00 AM</td>
                </tr>
                <tr>
                    <td>Tuesday</td>
                    <td>DBMS</td>
                    <td>10:00 AM</td>
                </tr>
                <tr>
                    <td colspan="3">BREAK</td>
                </tr>
                <tr>
                    <td>Wednesday</td>
                    <td>Cloud Computing</td>
                    <td>11:00 AM</td>
                </tr>
            </tbody>
        </table><br><br><br>
        <h1>FOOD MENU</h1>
        <table border="3px">
            <caption>A retaurent food menu</caption>
            <thead>
                <tr>
                    <th>Category</th>
                    <th>Item</th>
                    <th>Price</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td rowspan="3">Pizza</td>
                    <td>Margherita</td>
                    <td>₹180</td>
                </tr>    
                <tr>    
                    <td>Farmhouse</td>
                    <td>₹250</td>
                </tr> 
                <tr> 
                    <td>Cheese Burst</td>
                    <td>₹280</td>
                </tr>
                <tr>
                    <td rowspan="2">Burger</td>
                    <td>Veg Burger</td>
                    <td>₹120</td>
                </tr>
                <tr>
                    <td>Cheese Burger</td>
                    <td>₹150</td>
                </tr>
            </tbody>
        </table>
    </body>
</html>
