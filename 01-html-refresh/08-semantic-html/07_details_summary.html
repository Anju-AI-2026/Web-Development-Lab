<!DOCTYPE html>
<html>
    <head>
        <title>Details Summary Example</title>
    </head>
    <body>
        <header>
            <h1>Example for Details and Summary</h1>
        </header>
        <main>
            <details>
                <summary>What courses are available?</summary>
                <p>Our college offers Computer Science, Electronics, and Mechanical Engineering.</p>
            </details>

            <details open>
                <summary>What are the college timings?</summary>
                <p>The college timings are from 9:00 AM to 4:30 PM.</p>
            </details>

            <details>
                <summary>Where is the college located?</summary>
                <p>The college is located in Hubli, Karnataka.</p>
            </details>
        </main>
    </body>
</html>
