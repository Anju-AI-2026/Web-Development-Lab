<!DOCTYPE html>
<html>
    <head>
        <title>Date and Time</title>
    </head>
    <body>
        <header>
            <h1>Example for Date and Time</h1>
        </header>
        <main>
            <p>Our college event is on
            <time datetime="2026-09-10">10 September 2026</time>.
            </p>

            <p>The event starts at
            <time datetime="09:00">9:00 AM</time>.
            </p>
        </main>
    </body>
</html>
