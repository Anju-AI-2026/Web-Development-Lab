
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reset Login Test</title>
</head>
<body>
    <h2>Sweet Bakery Login Test</h2>
    <p>Click below to test the login page as a signed-out visitor.</p>

    <button onclick="resetLogin()">Reset Login Status</button>

    <script>
        function resetLogin() {
            localStorage.removeItem("sweetBakeryLoggedIn");
            window.location.replace("login.html");
        }
    </script>
</body>
</html>
