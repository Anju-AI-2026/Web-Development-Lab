<html>

            .container-main-body {

                justify-content: center;

                padding: 30px;
            }
            .inline-box{
                display: inline;
                background-color:rgb(231, 169, 179) ;
                border: 1px solid rgb(75, 20, 20);;

                padding: 10px;
            }

                padding: 30px;

        <header>
            <section>
                <div class="container-head-between">
                    <div>
                        <h4> 🧁 Sweet Bakery</h4>
                    </div>
                    <div class="inline-box">
                        <button>
                            <a href="!--home--!">Home</a>
                        </button>    
                        <button>
                            <a href="!--home--!">Menu</a>
                        </button>
                        <button>  
                            <a href="!--home--!">About</a>
                        </button>   
                        <button>
                            <a href="!--home--!">Cart</a>
                        </button>    
                    </div>
                </div>
            </section>
        </header>
        <main>
            <section>

                            <td>
                                <div>

                                    <p>Made with love for your day.</p>
                                    <button>
                                        <a href="!----!">Order Now ➡️</a>
                                    </button>
                                </div>    
                            </td>
                            <td>      
                                <div>
                                    <img src="./media/cupcake.png" alt="Cup Cake" width="350px">
                                </div>
                            </td> 
                        </tr>         
                    </div>
                </table>
            </section>

</html>
