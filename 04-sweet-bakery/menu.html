<html>
    <head>
        <title>Menu Page</title>
        <style>
            h1 {
                color: rgba(58, 3, 9, 0.934);
            }

            h4 {
                color: rgba(173, 85, 85, 0.671);
            }

            p {
                color: rgb(87, 16, 21);
            }

            .container-head-between {
                display: flex;
                justify-content: space-between;
                width: 1300px;
                border: 1px solid rgb(75, 20, 20);
                background-color: rgb(231, 169, 179);
            }

            .container-main-body {
                display: flex;
                flex-direction: column;
                justify-content: center;
                gap: 10px;
                padding: 30px;
                color: rgb(250, 210, 218);
            }

            .inline-box-image {
                display: inline;
                background-color: rgb(231, 169, 179);
                border: 1px solid rgb(75, 20, 20);
                margin: 10px;
                padding: 10px;
            }

            /* Corrected CSS for the four boxes below */
            .inline-box {
                display: inline-block;
                background-color: rgb(246, 169, 169);
                border: 2px solid rgb(250, 210, 218);
                margin: 10px;
                padding: 10px;
                width: 150px;
                text-align: center;
                vertical-align: top;
            }

            button {
                background-color: rgb(231, 169, 179);
                border: 1px solid rgb(75, 20, 20);
                padding: 8px 15px;
                margin: 5px;
            }

            button a {
                color: rgb(75, 20, 20);
                text-decoration: none;
            }

            table {
                width: 100%;
                border-collapse: collapse;
            }

            td {
                padding: 30px;
                vertical-align: middle;
            }

            .main-table {
                border: 1px solid rgb(75, 20, 20);
                background-color: rgb(244, 202, 209);
            }
        </style>
    </head>
    <body>
        <header>
            <section>
                    <div class="container-head-between">

                        <div>
                            <h4>🧁 Sweet Bakery</h4>
                        </div>

                        <div class="inline-box-image">
                            <button>
                                <a href="index.html">Home</a>
                            </button>

                            <button>
                                <a href="menu.html">Menu</a>
                            </button>

                            <button>
                                <a href="about.html">About</a>
                            </button>

                            <button>
                                <a href="cart.html">Cart</a>
                            </button>
                        </div>

                    </div>  
            </section>
        </header>
        <main>
            <div class="container-main-body">
                <section>
                    <h1>Our Menu</h1>
                    <h4>Handcrafted treats, made with Love. </h4>
                </section>
                <section>
                    <div class="inline-box">
                        
                    </div>
                </section>
            </div>    
        </main>
    </body>
</html>
