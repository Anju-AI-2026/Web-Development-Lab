<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Contact Book</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <header>
            <div>
                <h1>My Contacts ♡</h1>
                <p>Your little space for important people.</p>
            </div>
            <span id="contact-count">0 Contacts</span>
        </header>

        <section class="add-section">
            <h2 id="form-title">Add New Contact</h2>

            <form id="contact-form">
                <input type="text" id="name" placeholder="Full name" required>
                <input type="tel" id="phone" placeholder="Phone number" required>
                <input type="email" id="email" placeholder="Email address">

                <button type="submit" id="save-button">Add Contact</button>
                <button type="button" id="cancel-button">Cancel</button>
            </form>
        </section>

        <section class="contacts-section">
            <div class="section-heading">
                <h2>My People</h2>
                <input type="text" id="search" placeholder="Search contacts...">
            </div>

            <div id="contact-list"></div>
            <p id="empty-message">No contacts found. Add someone special!</p>
        </section>

    </div>

    <script src="script.js"></script>
</body>
</html>
