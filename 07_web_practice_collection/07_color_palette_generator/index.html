
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Palette Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">

        <header>
            <span class="decoration">✿</span>
            <p class="tagline">A LITTLE COLOUR MAGIC</p>
            <h1>Color Palette <span>Generator</span></h1>
            <p class="subtitle">
                Find beautiful colours for your next creative idea.
            </p>
            <span class="decoration">✧ ♡ ✧</span>
        </header>

        <section class="palette-section">

            <div class="palette" id="palette">

                <div class="color-card">
                    <div class="color-box"></div>
                    <p class="color-code">#FFB6C1</p>
                    <button class="copy-btn">Copy</button>
                </div>

                <div class="color-card">
                    <div class="color-box"></div>
                    <p class="color-code">#DDA0DD</p>
                    <button class="copy-btn">Copy</button>
                </div>

                <div class="color-card">
                    <div class="color-box"></div>
                    <p class="color-code">#ADD8E6</p>
                    <button class="copy-btn">Copy</button>
                </div>

                <div class="color-card">
                    <div class="color-box"></div>
                    <p class="color-code">#98FB98</p>
                    <button class="copy-btn">Copy</button>
                </div>

                <div class="color-card">
                    <div class="color-box"></div>
                    <p class="color-code">#FFFACD</p>
                    <button class="copy-btn">Copy</button>
                </div>

            </div>

            <button id="generateBtn">✦ Generate New Palette ✦</button>

            <p id="message">Click a colour's Copy button to copy its HEX code.</p>

        </section>

        <footer>
            Made with <span>♥</span> and a little creativity.
        </footer>

    </main>

    <script src="script.js"></script>
</body>
</html>
