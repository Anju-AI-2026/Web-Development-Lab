<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Studio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">

        <header>
            <h1>Password Studio ♡</h1>
            <p>Create strong passwords and keep your accounts safer.</p>
        </header>

        <section class="password-section">
            <label for="password">Your Password</label>

            <div class="password-box">
                <input type="text" id="password"
                    placeholder="Your password will appear here" readonly>

                <button id="copy-button">Copy</button>
            </div>

            <div class="strength-section">
                <span>Strength:</span>
                <span id="strength">Not generated</span>
            </div>

            <div class="strength-bar">
                <div id="strength-fill"></div>
            </div>
        </section>

        <section class="settings">
            <h2>Password Settings</h2>

            <label for="length">Password Length</label>

            <div class="length-control">
                <input type="range" id="length" min="4" max="32" value="12">
                <span id="length-value">12</span>
            </div>

            <div class="options">
                <label>
                    <input type="checkbox" id="uppercase" checked>
                    Uppercase letters
                </label>

                <label>
                    <input type="checkbox" id="lowercase" checked>
                    Lowercase letters
                </label>

                <label>
                    <input type="checkbox" id="numbers" checked>
                    Numbers
                </label>

                <label>
                    <input type="checkbox" id="symbols" checked>
                    Symbols
                </label>
            </div>

            <button id="generate-button">Generate Password</button>
            <p id="message"></p>
        </section>

        <footer>
            Made with care ♡
        </footer>

    </main>

    <script src="script.js"></script>
</body>
</html>
