<html>
    <head>
        <title>Register Page</title>
        <style>
            body{
                    background-color: rgb(181, 238, 238);
                    text-align: center;
                }
                h1{
                    text-align: center;
                    color: black;
                }
                h2{
                    text-align: center;
                    color: rgb(91, 91, 236);
                }
        </style>
    </head>   
    <body>
        <h1>CAMPUS CONNECT</h1><br>
        <h2>Create Your Account</h2><br>
        <h3>Personal Information</h3><br>
        <div>
            <form>
                <label>Full Name :</label>
                <input type="text" placeholder="Enter your fullname"><br>
                <label>Email :</label>
                <input type="email" placeholder="Enter your email"><br>
                <label>Password :</label>
                <input type="password" placeholder="Create password"><br>
                <label>Phone</label>
                <input type="tel" placeholder="Enter your phone"><br>
                <label>Age :</label>
                <input type="text">
                <label>Date of Brith :</label>
                <input type="date">
            </form>
        </div>
        <div>
            <h2>Academic Information</h2>
            <form>
                <select aria-placeholder="Select Department">
                    <option>Computer Science</option>
                    <option>Electrical & Electronics</option>
                    <option>Civil</option>
                    <option>Mechanical</option>
                    <option>ADFT</option>
                    <option>Commortial Practice</option>
                </select>
                <label>Year :</label><br>
                <label>
                    <input type="radio" name="FirstYear" value="FirstYear">First Year
                </label><br>
                <label>
                    <input type="radio" name="SecondYear" value="SecondYear">Second Year
                </label><br>
                <label>
                    <input type="radio" name="FinalYear" value="FinalYear">Final Year
                </label>
            </form>
        </div>
        <div>
            <h2>Interest</h2>
            <form>
                <label>
                    <input type="checkbox" name="Coding" value="Coding">Coding
                </label><br>
                <label>
                    <input type="checkbox" name="AI/ML" value="AI/ML">AI/ML
                </label><br>
                <label>
                    <input type="checkbox" name="Robotics" value="Robotics">Robotics
                </label><br>
                <label>
                    <input type="checkbox" name="Web Development" value="Web Development">Web Development
                </label><br>
            </form>
        </div> 
        <div>
            <h2>About You</h2>
            <foem>
                <label>Tell Us Something about Yourself :</label><br>
                <textarea name="Aboutyou" id="Aboutyou" >Write something about you...</textarea>
            </foem>
        </div>  
        <div>
            <h3>Profile Photo</h3>
            <form>
                <input type="file" placeholder="Choose file">
            </form>
        </div>
        <div>
            <form>
                <button type="submit">Register</button>
            </form>
            <div align = "right">
                <form>
                    <button type="reset">Reset</button>
                </form>
            </div>
        </div> 
    </body>
</html>
