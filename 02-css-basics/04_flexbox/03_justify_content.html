<html>
    <head>
        <title>
            Justify Content
        </title>
        <style>
            body{
                background-color: bisque;
            }
            h1{
                color: blueviolet;
                text-align: center;
            }
            .container-center{
                display: flex;
                justify-content: center;
                width: 600px;
                border: 5px solid rgb(235, 147, 32);
            }
            .container-start{
                display: flex;
                justify-content: flex-start;
                width: 600px;
                border: 5px solid rgb(235, 147, 32);
            }
            .container-end{
                display: flex;
                justify-content: flex-end;
                width: 600px;
                border: 5px solid rgb(235, 147, 32);
            }
            .container-between{
                display: flex;
                justify-content: space-between;
                width: 600px;
                border: 5px solid rgb(235, 147, 32);
            }
            .container-around{
                display: flex;
                justify-content: space-around;
                width: 600px;
                border: 5px solid rgb(235, 147, 32);
            }
            .container-evenly{
                display: flex;
                justify-content: space-evenly;
                width: 600px;
                border: 5px solid rgb(235, 147, 32);
            }
        </style>
    </head>
    <body>
        <header>
            <h1>Justify Content Example</h1>
        </header>
        <main>
            <div class="container-center">
                <div>Item 1</div>
                <div>Item 2</div>
            </div><br><br>
            <div class="container-start">
                <div>Item 1</div>
                <div>Item 2</div>
            </div><br><br>
            <div class="container-end">
                <div>Item 1</div>
                <div>Item 2</div>
            </div><br><br>
            <div class="container-between">
                <div>Item 1</div>
                <div>Item 2</div>
            </div><br><br>
            <div class="container-around">
                <div>Item 1</div>
                <div>Item 2</div>
            </div><br><br>
            <div class="container-evenly">
                <div>Item 1</div>
                <div>Item 2</div>
            </div>
        </main>
    </body>
</html>
