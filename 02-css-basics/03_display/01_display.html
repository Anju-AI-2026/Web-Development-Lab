<html>
    <head>
        <title>Display Example</title>
        <style>
            body{
                background-color: azure;
            }
            h1{
                text-align: justify;
                color: black;
            }
            h2{
                color: rgb(70, 246, 26);
            }
            .block-box{
                display: block;
                width: 200px;
                height: 50px;
                background-color: blueviolet;
                border: 5px solid blue;
                margin: 10px;
                padding: 10px;
            }
            .inline-box{
                display: inline;
                background-color:brown;
                border: 2px solid burlywood;
                margin: 10px;
                padding: 10px;
            }
            .inline-block-box{
                display : inline-block;
                width: 150px;
                height: 70px;
                background-color: pink;
                border: 2px solid plum;
                margin: 10px;
                padding: 10px;
            }
        </style>
    </head>
    <body>
        <header>
            <h1>Display Example</h1>
        </header>
        <main>
            <h2>Block Elements</h2>
            <div class="block-box">Block Box 1</div>
            <div class="block-box">Block Box 2</div>

            <h2>Inline Elements</h2>
            <div class="inline-box">Inline Box 1</div>
            <div class="inline-box">Inline Box 2</div>

            <h2>Inline-Block Elements</h2>
            <div class="inline-block-box">Inline Block Box 1</div>
            <div class="inline-block-box">Inline Block Box 2</div>
        </main>
    </body>
</html>
